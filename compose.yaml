services:
  mysql:
    image: mysql:8.4
    container_name: reelrouter-mysql
    restart: unless-stopped

    env_file:
      - .env

    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}

    ports:
      - "3307:3306"

    volumes:
      - mysql_data:/var/lib/mysql

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h localhost -u root -p$${MYSQL_ROOT_PASSWORD} --silent"
        ]
      interval: 5s
      timeout: 5s
      retries: 15

  app:
    build: .
    container_name: reelrouter-app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # 容器内不能访问宿主机的 127.0.0.1；使用 Compose 服务名连接 MySQL。
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      VIDEO_PROVIDER: ${VIDEO_PROVIDER:-mock}
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data

volumes:
  mysql_data:
